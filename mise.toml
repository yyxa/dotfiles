# ~/.config/mise/config.toml (или ~/dotfiles/mise.toml после стова)

[tools]
# общие тулзы — ставятся на все ОС
starship = "latest"
zoxide = "latest"
fzf = "latest"
ripgrep = "latest"

[tasks.dotfiles-stow]
description = "stow все переносимые конфиги"
run = """
STOW_DIR="$HOME/dotfiles"
EXCLUDES="nix-config images .git .gitignore README.md .qlty mise.toml vxwm"
for item in $(ls -d "$STOW_DIR"/.[!.]* $STOW_DIR/* 2>/dev/null | xargs -n1 basename | grep -vFf <(echo "$EXCLUDES")); do
    echo "Stowing $item..."
    ln -sfn "$STOW_DIR/$item" "$HOME/$item"
done
"""

[tasks.dotfiles-stow-nixos]
requires = ["dotfiles-stow"]
description = "nixos-specific: stow nix-config через flake"
condition.program = "nixos-version"
run = "sudo nixos-rebuild switch --flake /home/yyxa/dotfiles/nix-config#yyxa --impure"

[tasks.dotfiles-stow-linux]
requires = ["dotfiles-stow"]
description = "ubuntu/mint: stow + установить bin/"
condition.exec = "[[ \"$(uname -s)\" != Linux ]] && exit 1"
run = """
ln -sfn ~/dotfiles/bin ~/bin
ln -sfn ~/dotfiles/.xinitrc ~/.xinitrc
ln -sfn ~/dotfiles/.xprofile ~/.xprofile
"""