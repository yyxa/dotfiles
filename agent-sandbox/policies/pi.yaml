version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc, /bin, /sbin]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies:
  freellmapi:
    endpoints:
      - host: host.openshell.internal
        port: 3001
        protocol: rest
        enforcement: enforce
        allowed_ips: [172.17.0.1/32]
        rules:
          - allow: { method: GET,  path: /v1/** }
          - allow: { method: POST, path: /v1/** }
    binaries: [/usr/local/bin/node]
  npm:
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries: [/usr/local/bin/node]
  github:
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries: [/usr/bin/git]