services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17-rootless
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__server__DOMAIN=localhost
      - FORGEJO__server__ROOT_URL=http://localhost:3000/
      - FORGEJO__server__DISABLE_SSH=true
      - FORGEJO__server__OFFLINE_MODE=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=true
      - FORGEJO__mirror__ENABLED=false
      - FORGEJO__repository__DEFAULT_PRIVATE=true
      - FORGEJO__actions__ENABLED=false
      - FORGEJO__webhook__ALLOWED_HOST_LIST=loopback
      - FORGEJO__mailer__ENABLED=false
      - FORGEJO__picture__DISABLE_GRAVATAR=true
      - FORGEJO__security__INSTALL_LOCK=true
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000"
      - "172.17.0.1:3000:3000"
    restart: unless-stopped